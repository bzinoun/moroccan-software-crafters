# Deploys the static export (out/) to GitHub Pages.
# The owner must set Settings > Pages > Source to "GitHub Actions" once.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The called CI workflow uses its own concurrency group, so these two never collide.
concurrency:
  group: pages
  cancel-in-progress: false

# A called workflow cannot raise the token permissions of its calling job.
permissions: {}

jobs:
  gates:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /moroccan-software-crafters
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
